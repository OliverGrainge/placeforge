[project]
name = "placeforge"
version = "0.1.0"
description = "Place recognition and matching"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # TensorBoard still imports pkg_resources; setuptools 82+ removed it.
    "setuptools>=70,<82",
    # Core CLI and data pipeline
    "pandas",
    "pyarrow",
    "PyYAML",
    "tqdm",
    "python-dotenv",
    "prettytable",
    # Dataset loading and visualization
    "Pillow",
    "matplotlib",
    # Training stack
    "torch",
    "torchvision",
    "pytorch-lightning",
    "pytorch-metric-learning",
    "torchmetrics",
    "lightning_utilities",
    "tensorboard",
    "faiss-cpu",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapipelines", "src/modules", "src/datamodules"]
