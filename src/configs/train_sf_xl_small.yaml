wandb:
  project: placeforge
  name: sf_xl_small

trainer:
  max_epochs: 250
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10

module:
  name: contrastive
  model_name: dinov2_gem
  model_kwargs:
    descriptor_dim: 256
    backbone_name: dinov2_vits14
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  temperature: 0.07
  val_recall_ks: [1, 5, 10]

datamodule:
  name: place_recognition_train
  train_dataset: sf_xl_small_geometric
  val_datasets:
    - pitts30k
  places_per_batch: 32
  images_per_place: 4
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  seed: 42
  transform:
    name: train
    image_size: 224
  val_transform:
    name: eval
    image_size: 224
