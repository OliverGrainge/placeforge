wandb:
  project: placeforge
  name: sf_xl_small

trainer:
  max_epochs: 10
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10

module:
  name: contrastive
  model_name: dinov2_gem
  model_kwargs:
    descriptor_dim: 256
    backbone_name: dinov2_vits14
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  temperature: 0.07

datamodule:
  name: place_recognition_train
  index_path: /home/oliver/github/placeforge/data/sf_xl_small_basic/index.parquet
  places_per_batch: 32
  images_per_place: 4
  num_workers: 4
  pin_memory: true
  shuffle: true
  drop_last: true
  seed: 42
  transform:
    name: train
    image_size: 224
