# ── Logger ────────────────────────────────────────────────────────────────────
# Use a single logger dict, or a list of loggers to log to multiple backends
# at once. Each entry needs a "type" key: wandb, csv, or tensorboard.
# Any other keys are passed directly to the PyTorch Lightning logger constructor.
#
# Single logger (online):
#   logger:
#     type: wandb
#     project: placeforge_classification
#
# Single logger (offline – no internet required):
#   logger:
#     type: csv
#     name: csv_logs
#
# Multiple loggers (e.g. always have a local CSV backup):
#   logger:
#     - type: wandb
#       project: placeforge_classification
#     - type: csv
#       name: csv_logs
#
# All loggers write to the logs/ directory by default (override with save_dir).
logger:
  - type: wandb
    project: placeforge_classification
    name: cosplace_boq
  - type: csv
    name: csv_logs

trainer:
  max_steps: 10000  # use max_steps instead of max_epochs
  max_epochs: -1  # disable epoch limit when using max_steps
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  val_check_interval: 5000
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0  # prevent fp16 overflow from CosFace scale amplifying gradients

compile: false

module:
  name: classification
  model_name: dinov2_boq
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 1000
  backbone_lr_scale: 0.1
  criterion_lr_scale: 10.0
  lr_schedule: constant
  val_recall_ks: [1, 5, 10]
  
datamodule:
  name: place_recognition
  train_dataset_name: sf_xl_cosplace
  dataset_type: classification
  #num_supergroups: 3
  num_places: 1000
  val_dataset_names:
    - pitts30k_val
  test_dataset_names:
    - pitts30k_test
    - msls_val
    - tokyo247_test
    - nordland_test
    - svox_test
  batch_size: 128
  images_per_place: 4
  num_workers: 8
  transform:
    name: train
    image_size: 224
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
