# Short smoke run: small step budget, subsampled train data, capped val/test batches.
logger:
  name: test_gsvcities

trainer:
  max_steps: 500
  max_epochs: -1
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 4
  val_check_interval: 1000
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0


compile: false

module:
  model_name: dinov2_gem
  model_kwargs:
    use_checkpointing: false
    unfreeze_n_blocks: 2
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 25
  backbone_lr_scale: 0.1
  lr_schedule: constant
  val_recall_ks: [1, 5]
  miner_epsilon: 0.1

datamodule:
  train_dataset_name: gsvcities_train
  #source_sample_weights:
 #   sf_xl_small: 0.5
  #  gsvcities: 0.5
  val_dataset_names:
    - pitts30k_val
  test_dataset_names:
    - pitts30k_test
  batch_size: 32
  images_per_place: 4
  num_workers: 16
  transform:
    name: train
    image_size: 224
    augmentation: heavy
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
