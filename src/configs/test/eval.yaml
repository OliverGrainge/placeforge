# Path to a standalone checkpoint (model weights, not a full Lightning ckpt).
# Supports .ckpt, .pth, .pt files. Uses robust loading with automatic
# prefix stripping/adding to match the model's keys.
checkpoint: /home/oliver/github/placeforge/checkpoints/baselines/mutualvpr_gem/best_model.pth

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed

module:
  model_name: dinov2_gem          # dinov2_gem | dinov2_salad | dinov2_boq
  val_recall_ks: [1, 5, 10]

datamodule:
  train_dataset_name: sf_xl_train
  val_dataset_names: 
    - pitts30k_val
  test_dataset_names:
    - pitts30k_test
    - msls_val
    - tokyo247_test 
    - nordland_test
    - svox_test
  batch_size: 32
  num_workers: 8
  test_transform:
    name: eval
    image_size: 224
