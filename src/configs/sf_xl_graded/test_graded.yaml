# Smoke-test config: minimal steps, capped val/test batches, small batch size.
logger:
  - type: wandb
    project: placeforge_graded
    name: test_graded
  - type: csv
    name: csv_logs

trainer:
  max_steps: 10000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 1
  val_check_interval: 250
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0

compile: false

module:
  name: graded_similarity
  model_name: dinov2_boq
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 2
  backbone_lr_scale: 0.1
  val_recall_ks: [1, 5, 10]
  margin: 1.0

datamodule:
  name: graded_similarity
  train_dataset_name: sf_xl_graded
  val_dataset_names:
    - pitts30k_val
  test_dataset_names:
    - pitts30k_test
  batch_size: 128
  num_workers: 2
  transform:
    name: train
    image_size: 224
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
