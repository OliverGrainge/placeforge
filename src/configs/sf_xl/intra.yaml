wandb:
  project: placeforge_sf_xl
  name: sf_xl_intra

trainer:
  max_steps: 10000  # use max_steps instead of max_epochs
  max_epochs: -1  # disable epoch limit when using max_steps
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  val_check_interval: 400  # run validation every N steps
  check_val_every_n_epoch: null

module:
  name: contrastive
  model_name: resnet50_gem
  model_kwargs:
    descriptor_dim: 512
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  val_recall_ks: [1, 5, 10]

datamodule:
  name: place_recognition
  train_dataset_name: sf_xl_intra
  val_dataset_names:
    - sf_xl_small_val
  batch_size: 32
  images_per_place: 4
  num_workers: 2
  transform:
    name: train
    image_size: 224
  val_transform:
    name: eval
    image_size: 2