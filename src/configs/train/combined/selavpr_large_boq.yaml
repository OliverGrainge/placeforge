logger:
  name: combined_selavpr_large_boq

trainer:
  max_steps: 30000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  val_check_interval: 1000
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0

compile: false

module:
  model_name: selavpr_large_boq
  #model_kwargs:
  #  freeze_up_to: layer2   # example: only train layer4 + head
  #  descriptor_dim: 1024

  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 50
  backbone_lr_scale: 0.5
  lr_schedule: staged
  lr_stages:
    - until: 20000
      scale: 1.0
    - until: 5000
      scale: 0.35
    - until: 5000
      scale: 0.1
  val_recall_ks: [1, 5, 10]
  miner_epsilon: 0.1

datamodule:
  train_dataset_name: gsvcities_sf_xl_pitts30k_train
  fraction: 1.0
  val_dataset_names:
    - pitts30k_test
  test_dataset_names:
    - pitts30k_test
    - msls_val
    - tokyo247_test
    - nordland_test
    - svox_test
  batch_size: 128
  images_per_place: 4
  num_workers: 16
  transform:
    name: train
    image_size: 224
    augmentation: heavy
  val_transform:
    name: eval
    image_size: 322
  test_transform:
    name: eval
    image_size: 322
