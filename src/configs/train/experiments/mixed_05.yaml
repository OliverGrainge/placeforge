# ResNet-18 ablation run on sf_xl_small with cos_sim_threshold=0.00.
logger:
  name: mixed_05

trainer:
  max_steps: 5000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 4
  val_check_interval: 1000
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0


compile: false

module:
  model_name: resnet18_gem
  model_kwargs:
    freeze_up_to: none
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 25
  backbone_lr_scale: 1.0
  lr_schedule: constant
  val_recall_ks: [1, 5]
  miner_epsilon: 0.1

datamodule:
  train_dataset_name: sf_xl_gsvcities_0p30_train
  source_sample_weights:
    sf_xl: 0.5
    gsvcities: 0.5
  val_dataset_names:
    - pitts30k_val
  test_dataset_names:
    - pitts30k_test
  batch_size: 32
  images_per_place: 4
  num_workers: 2
  transform:
    name: train
    image_size: 224
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
