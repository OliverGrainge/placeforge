logger:
  name: abl_sg512

trainer:
  max_steps: 4000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  val_check_interval: 1000
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0

compile: false

module:
  model_name: selavpr_base_boq
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 50
  backbone_lr_scale: 0.5
  lr_schedule: staged
  lr_stages:
    - until: 10000
      scale: 1.0
  val_recall_ks: [1, 5, 10]
  miner_epsilon: 0.1

datamodule:
  train_dataset_name: sf_xl_abl_sg512
  fraction: 1.0
  val_dataset_names:
    - pitts30k_val
  test_dataset_names:
    - pitts30k_test
    - nordland_test
  batch_size: 120
  images_per_place: 4
  num_workers: 16
  transform:
    name: train
    image_size: 224
    augmentation: light
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
