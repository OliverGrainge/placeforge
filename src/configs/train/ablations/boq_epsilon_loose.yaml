logger:
  name: boq_epsilon_loose

trainer:
  max_steps: 30000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  val_check_interval: 2500
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0

compile: false

module:
  model_name: dinov2_boq
  model_kwargs:
    use_checkpointing: false
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  backbone_lr_scale: 0.1
  lr_schedule: cosine
  val_recall_ks: [1, 5]
  miner_epsilon: 0.2

datamodule:
  train_dataset_name: sf_xl_curavpr
  fraction: 1.0
  val_dataset_names:
    - pitts30k_val
  test_dataset_names:
    - pitts30k_test
    - msls_val
    - tokyo247_test
    - nordland_test
    - svox_test
  batch_size: 128
  images_per_place: 4
  num_workers: 16
  transform:
    name: train
    image_size: 224
    augmentation: heavy
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
