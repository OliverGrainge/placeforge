logger:
  - type: wandb
    project: placeforge_curavpr
    name: dinov2_gem
  - type: csv
    name: csv_logs

trainer:
  max_steps: 10000
  max_epochs: -1
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  val_check_interval: 1000
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0

compile: false

module:
  name: curavpr
  model_name: dinov2_gem
  model_kwargs:
    use_checkpointing: false
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 200
  backbone_lr_scale: 0.3
  lr_schedule: cosine
  val_recall_ks: [1, 5]

datamodule:
  name: curavpr
  train_dataset_name: sf_xl_curavpr
  fraction: 1.0
  val_dataset_names:
    - pitts30k_val
    - msls_val
  test_dataset_names:
    - pitts30k_test
    - msls_val
    - tokyo247_test 
    - nordland_test
    - svox_test
  batch_size: 128
  images_per_place: 4
  num_workers: 8
  transform:
    name: train
    image_size: 224
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
