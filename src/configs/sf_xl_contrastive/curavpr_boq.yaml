logger:
  - type: wandb
    project: placeforge_contrastive
    name: contrastive_curavpr_boq
  - type: csv
    name: csv_logs

trainer:
  max_steps: 10000  # use max_steps instead of max_epochs
  max_epochs: -1  # disable epoch limit when using max_steps
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  log_every_n_steps: 10
  val_check_interval: 500
  check_val_every_n_epoch: null
  gradient_clip_val: 1.0  # clip gradient norm to stabilise metric learning

compile: true

module:
  name: contrastive
  model_name: dinov2_boq
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  warmup_steps: 500
  backbone_lr_scale: 0.1  # pretrained backbone gets 10x lower lr than the head
  val_recall_ks: [1, 5, 10]

datamodule:
  name: place_recognition
  train_dataset_name: sf_xl_curavpr
  dataset_type: contrastive
  num_supergroups: null
  val_dataset_names:
    - pitts30k_val 
  test_dataset_names:
    - pitts30k_test
    - msls_val
    - tokyo247_test
    - nordland_test
    - svox_test
  batch_size: 128
  images_per_place: 4
  num_workers: 2
  transform:
    name: train
    image_size: 224
  val_transform:
    name: eval
    image_size: 224
  test_transform:
    name: eval
    image_size: 224
